<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudOps · ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <!-- ダッシュボードで選んだテーマ（app.js の THEME_KEY）を引き継ぐ -->
  <script>try { const theme = localStorage.getItem('cloudops-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); document.documentElement.dataset.theme = theme; } catch { }</script>
</head>
<body class="login-page">
  <main class="login-card card">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/></svg></div><div><strong>CloudOps</strong><small>ダッシュボードにログイン</small></div></div>
    <form method="post" action="/login">
      <label>ユーザー名<input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required {{if not .Username}}autofocus{{end}}></label>
      <label>パスワード<input name="password" type="password" autocomplete="current-password" required {{if .Username}}autofocus{{end}}></label>
      {{if .Error}}<div class="notice danger" role="alert">{{.Error}}</div>{{end}}
      <button class="button" type="submit">ログイン</button>
    </form>
    <p class="muted login-help">アカウントの作成やパスワードの再設定は管理者に依頼してください。</p>
  </main>
</body>
</html>
