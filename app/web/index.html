<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CloudOps: AWS運用ダッシュボード（Bento テスト版）">
  <title>CloudOps · ダッシュボード</title>
  <!-- フォントを読み込めない環境（インターネットに出られない VPN など）ではシステムフォントで表示される -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="sidebar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/></svg></div><div><strong>CloudOps</strong><small id="mode-detail">ローカル設定を確認中…</small></div></div>
      <nav id="nav" aria-label="メインナビゲーション"></nav>
      <div class="header-tools">
        <div class="mode-card"><span class="mode-dot"></span><strong id="mode-label">モードを読み込み中</strong></div>
        <div class="user-card" id="user-card" hidden><span id="user-name"></span><button type="button" id="open-password">パスワード変更</button><form method="post" action="/logout"><button type="submit">ログアウト</button></form></div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="ライトモードとダークモードを切り替え" aria-pressed="false">
          <span class="theme-toggle-icon" id="theme-icon" aria-hidden="true">☾</span>
          <span class="sr-only"><strong id="theme-label">ダークモード</strong><small id="theme-detail">ライトに切り替え</small></span>
        </button>
      </div>
    </header>
    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow" id="breadcrumb">CLOUDOPS / 概要</p><h1 id="page-title">概要</h1><p class="subtitle" id="page-subtitle">AWSインフラの全体概要</p></div>
        <div class="toolbar">
          <span class="live-pill"><i aria-hidden="true"></i>自動更新 60秒</span>
          <div class="range-controls">
            <label class="sr-only" for="period">期間</label>
            <select id="period">
              <option value="1">過去1日</option>
              <option value="7">過去7日間</option>
              <option value="30">過去1か月（30日）</option>
              <option value="custom">カスタム期間</option>
            </select>
            <div id="custom-range" class="custom-range" hidden>
              <!-- 期間は自前のピッカー（app.js）で選ぶ。値は JST の "YYYY-MM-DDTHH:mm" で hidden の input に入れる -->
              <button class="range-pill" id="range-pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="date-picker"><span id="range-label">開始日 › 終了日</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
              <input id="period-start" type="hidden">
              <input id="period-end" type="hidden">
              <div class="date-picker" id="date-picker" role="dialog" aria-label="期間を選択（JST）" hidden>
                <div class="picker-months" id="picker-months"></div>
                <div class="picker-fields">
                  <label>開始日<input id="field-start-date" type="text" inputmode="numeric" placeholder="YYYY/MM/DD" autocomplete="off"></label>
                  <label>開始時刻<input id="field-start-time" type="text" inputmode="numeric" placeholder="hh:mm" autocomplete="off"></label>
                  <label>終了日<input id="field-end-date" type="text" inputmode="numeric" placeholder="YYYY/MM/DD" autocomplete="off"></label>
                  <label>終了時刻<input id="field-end-time" type="text" inputmode="numeric" placeholder="hh:mm" autocomplete="off"></label>
                </div>
                <p class="picker-hint" id="picker-hint" aria-live="polite"></p>
                <div class="picker-foot">
                  <button class="pill-button" type="button" data-picker-clear>クリア</button>
                  <span class="spacer"></span>
                  <button class="link-button" type="button" data-picker-cancel>キャンセル</button>
                  <button class="button" id="apply-period" type="button">適用</button>
                </div>
              </div>
            </div>
          </div>
          <button class="icon-button" id="refresh" type="button" aria-label="今すぐ更新">↻</button>
        </div>
      </header>
      <div id="app" aria-live="polite"><div class="loading">ダッシュボードを読み込み中…</div></div>
      <footer class="status-bar"><span id="status-text">データ待ち</span><span id="updated-at">—</span></footer>
    </main>
  </div>
  <dialog class="password-dialog card" id="password-dialog" aria-labelledby="password-title">
    <form id="password-form">
      <h2 id="password-title">パスワード変更</h2>
      <!-- パスワードマネージャーがどのユーザーのパスワードかを判別できるようにする -->
      <input id="password-username" type="text" autocomplete="username" hidden>
      <label>現在のパスワード<input id="current-password" type="password" autocomplete="current-password" required></label>
      <label>新しいパスワード（12 文字以上）<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label>
      <label>新しいパスワード（確認）<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label>
      <div class="notice danger" id="password-error" role="alert" hidden></div>
      <p class="muted password-help">変更すると、他の端末やブラウザのログインは解除されます。</p>
      <div class="dialog-actions"><button class="link-button" type="button" data-password-cancel>キャンセル</button><button class="button" type="submit" id="password-submit">変更する</button></div>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
